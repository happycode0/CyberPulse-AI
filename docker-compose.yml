services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - rawcache:/var/cache/cyberpulse
    # The ops API listens on 8700 for the Paperclip server (worker/ops_api.py). No `ports:`,
    # ever: only the compose network may reach it, and a published port bypasses the firewall.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8700/ops/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Paperclip — the agents' control plane (Stage 4). Optional by design: if it is
  # stopped or broken, the worker keeps collecting and publishing (PLAN.md §2.3).
  server:
    # Pinned by digest. Bump the tag and the digest together, on purpose.
    image: ghcr.io/paperclipai/paperclip:2026.1001.0@sha256:08dbadebd4d40550eb336c25c3691f582322a88bae3f1cca101c5dd096bdc9d3
    # No `init: true`: the image already runs tini as PID 1. pids_limit is upstream's backstop.
    pids_limit: 2048
    ports:
      # Home network only — never 0.0.0.0, never a router port forward. Docker-published
      # ports bypass the host firewall, so this address is the only thing limiting exposure.
      # Set PAPERCLIP_BIND_ADDRESS in .env to the VM's own LAN address (a DHCP reservation
      # keeps it stable).
      - "${PAPERCLIP_BIND_ADDRESS}:3100:3100"
    # Explicit list, not env_file: Paperclip gets its own settings and nothing else
    # (no publish token, no API keys).
    environment:
      # Its own database in the shared Postgres; create it once (wiki: paperclip-setup step 1).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}
      PAPERCLIP_AUTH_BASE_URL_MODE: ${PAPERCLIP_AUTH_BASE_URL_MODE:-explicit}
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}
      PAPERCLIP_TELEMETRY_DISABLED: ${PAPERCLIP_TELEMETRY_DISABLED:-1}
      PAPERCLIP_ANNOUNCEMENTS_ENABLED: ${PAPERCLIP_ANNOUNCEMENTS_ENABLED:-false}
      PAPERCLIP_SECRETS_STRICT_MODE: ${PAPERCLIP_SECRETS_STRICT_MODE:-true}
      # The five http agents wake the worker's ops API, a private address Paperclip refuses
      # unless it is listed here.
      PAPERCLIP_HTTP_ADAPTER_PRIVATE_ENDPOINT_ALLOWLIST: http://worker:8700
      # For the AI agents, which inherit this environment: the ops API's read endpoints
      # (GET $CYBERPULSE_OPS_URL/ops). The token opens reads only; nothing there writes.
      CYBERPULSE_OPS_URL: http://worker:8700
      CYBERPULSE_OPS_TOKEN: ${CYBERPULSE_OPS_TOKEN:-}
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  rawcache:
  paperclip-data:
