<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark on its own: the diamond that precedes CYBERPULSE in the wordmark, in
       --cyan on --bg-void. One shape and two colours, because a favicon is read at 16px and
       anything finer than this becomes a smudge. Drawn rather than photographed so it costs
       no raster and scales to any tab, bookmark or installed-icon size. -->
  <rect width="32" height="32" rx="7" fill="#121926"/>
  <path d="M16 4 L28 16 L16 28 L4 16 Z" fill="#5BD6E8"/>
  <path d="M16 11.4 L20.6 16 L16 20.6 L11.4 16 Z" fill="#121926"/>
</svg>
