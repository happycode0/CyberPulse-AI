# AI stories for the golden set, waiting for the owner's labels (worker/ai/golden.py).
#
# The rest of the golden set takes its labels from the registers. Nothing like that exists
# for AI news, so a person has to label these. Until someone does, the gauntlet ignores them.
# A blank label changes nothing.
#
# How to label (the owner):
#
# 1. Open each story's url and read it.
# 2. Fill in its labels:
#    - beat: cyber, ai, both or other. "both" is an AI story with a security angle.
#      "other" is a story on neither desk.
#    - ai_significance: major, notable or minor. Fill it in only for ai or both.
#      docs/wiki/ai-news-beat.md says what each level means.
#    - au_desk: true if it matters in Australia, false if it does not. Leave it blank if
#      you are not sure: a blank one is not scored.
# 3. Set reviewed to true on each story you labelled yourself. Leave the rest false.
# 4. A story only counts once the worker has collected it, so check its url is in the
#    Events feed. If a story never arrived (its feed moved on before the source was
#    added), swap in another AI story from the Events feed. Put in its url, source_id,
#    headline and published date, and leave its labels blank until you have read it.
# 5. Commit, deploy, then pin the set again:
#    docker compose exec -T worker python -m worker --pin-golden-set
#    The gauntlet stops reusing earlier results, because the set has changed.
#
# Never fill in a label you have not checked against the story. A model's guess is not a label.
#
# Only the url, source and headline are kept here. The record a model sees comes from the
# event in the database when the set is pinned.

