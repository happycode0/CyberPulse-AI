# What the trend engine counts (worker/pipeline/trends.py). A report counts towards a topic when
# its own headline names one of the topic's terms. Headlines are read as the resolver reads them:
# lowercase, punctuation dropped ("zero-day" is "zeroday", "D-Link" is "dlink"), and a term of
# several words matches those words in a row.
#
# Words that are also everyday English are left out ("progress", "play", "edge", "intel",
# "exchange", "ios" which is Apple's and Cisco's): a topic must rise on news, not on prose.
# A model may propose a topic; it lands here by review, never at run time.
version: "1"

