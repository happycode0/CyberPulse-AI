# Organisations that publish through more than one feed. Everything one of them says is one
# voice: ACSC's alert and its news item on the same thing are one confirmation, not two
# (worker/pipeline/lineage.py). `names` are how headlines name an agency when relaying it
# ("ACSC warns ...", "... Added to CISA KEV"). Only agencies have them: "Microsoft" in a
# headline is as often the product as the one speaking.
publishers:
  asd:
    name: Australian Signals Directorate
    names: [ASD, ACSC, Australian Cyber Security Centre, Australian Signals Directorate]
  cisa:
    name: CISA
    names: [CISA, Cybersecurity and Infrastructure Security Agency]
  google:
    name: Google
  microsoft:
    name: Microsoft
  mysecuritymedia:
    name: MySecurity Media
  abc:
    name: ABC

# Every source has a `description` (one plain sentence, published on the site's Sources page)
# and a `standing`, the base of its reputation (worker/pipeline/reputation.py):
#   authoritative  government agencies, CERTs, standards bodies, a vendor's own security
#                  advisories about its own products
#   established    national public broadcasters, major newsrooms, long-running specialist
#                  outlets with editorial standards
#   specialist     trade press, vendor research and blogs, respected individual researchers,
#                  academic preprints
#   community      aggregators, social search, personal blogs without editorial review
# docs/wiki/importance-and-reputation.md says how to change one.
