# Organisations that publish through more than one feed. Everything one of them says is one
# voice: ACSC's alert and its news item on the same thing are one confirmation, not two
# (worker/pipeline/lineage.py). `names` are how headlines name an agency when relaying it
# ("ACSC warns ...", "... Added to CISA KEV"). Only agencies have them: "Microsoft" in a
# headline is as often the product as the one speaking.
publishers:
  asd:
    name: Australian Signals Directorate
    names: [ASD, ACSC, Australian Cyber Security Centre, Australian Signals Directorate]
  cisa:
    name: CISA
    names: [CISA, Cybersecurity and Infrastructure Security Agency]
  google:
    name: Google
  microsoft:
    name: Microsoft
  mysecuritymedia:
    name: MySecurity Media
  abc:
    name: ABC

