    type: rss
    region: au
    category: advisory
    class: feed
    priority: 1
    lane: fast
    enabled: true
    url: https://www.cyber.gov.au/rss/alerts
    parser: rss
    expected_frequency: monthly
    notes: "Measured over the year to 2026-10-03: median 8 days between alerts, longest 41"

