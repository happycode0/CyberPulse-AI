# Versioned scoring configuration (PLAN.md section 5, "Scoring").
# `version` must equal worker.version.SCORING_VERSION; bump both together whenever
# any number below changes, so stored scores can be traced to the rules that made them.
version: "4"

# Base severity weight. Severity and prominence stay separate: this is severity only.
severity_weights:
  critical: 4
  high: 3
  medium: 2
  low: 1
  unknown: 1.5   # between low and medium: unrated is not the same as harmless

# Added to the severity weight when any attached CVE is listed in CISA KEV.
kev_bonus: 1.5

# Freshness half-life in hours, by severity. Decay is measured from
# last_material_update only; repeat sightings (last_seen) never reset it.
half_life_hours:
  critical: 168
  high: 72
  medium: 24
  low: 24
  unknown: 24

# The AI desk's scale (docs/wiki/ai-news-beat.md). An AI-only story is ranked on its
# ai_significance in place of severity, so AI news is never scored as an unrated cyber threat.
# `unknown` is one triage has not judged yet. A story on both desks takes the stronger weight
# and the longer half-life of the two scales. Major matches critical, so a major AI story stays
# live at least as long as a critical cyber one.
ai_beat:
  weights:
    major: 4
    notable: 3
    minor: 1
    unknown: 1.5
  half_life_hours:
    major: 168
    notable: 72
    minor: 24
    unknown: 24

# Confidence floor contributed by the best evidence class among an event's sources.
evidence_class_weights:
  PRIMARY: 0.90
  AUTHORITATIVE: 0.85
  VENDOR: 0.75
  SPECIALIST: 0.60
  NEWS: 0.45
  COMMUNITY: 0.30
  SOCIAL: 0.20
  AI_INFERENCE: 0.15

# Each additional independent lineage closes this fraction of the remaining gap to 1.0.
corroboration_gain: 0.5

# Independent confirmations at which the prominence corroboration term saturates.
corroboration_cap: 3

# Novelty halves this many hours after first_seen.
novelty_half_life_hours: 48

# intensity = sum(weight * term); prominence = freshness * intensity. Weights must sum to 1.
prominence_weights:
  severity: 0.40
  corroboration: 0.20
  au_relevance: 0.25
  novelty: 0.15

# Archive, never delete. An event is archived once its prominence decays below
# `prominence_below` or its last material update is more than `idle_days` old. It stays on the
# site's day pages but leaves the live set, and only a material change brings it back.
archive:
  prominence_below: 0.05
  idle_days: 30

# AU relevance (worker/pipeline/au.py). Facts in the record set a floor under the number, each
# with a reason; the model's reading may lift it but never lower it. Matching is case-sensitive
# on whole words, on what the sources said (titles, the feed's text, other headlines), never on
# the model's summary. Names that are often not Australian at all stay off these lists:
# Victoria, Darwin, Medicare, ASIC, ASD, ABC, ATO, AFP, and Australian vendors whose products
# are used everywhere (Atlassian, Canva).
au:
  floors:
    authority: 0.70     # an Australian government authority published it
    organisation: 0.75  # the record names an Australian organisation
    place: 0.55         # it names Australia, an Australian place, or a .au web address
    outlet: 0.30        # an Australian outlet reported it
  max_reasons: 6
  # SOCI Act sectors are listed only for events at least this relevant to Australia.
  soci_min_relevance: 0.5

  # Source ids (config/sources.yaml) that are Australian government authorities.
  authorities:
    [acsc_alerts, acsc_advisories, acsc_news, acsc_publications, acsc_threats, acsc_advice,
     asd, oaic, dta]

  # Naming any of these is "names Australia"; naming a place is "names an Australian place".
  country: [Australia, Australian, Australians, Aussie, Aussies]
  places:
    [New South Wales, NSW, Queensland, Qld, Tasmania, Tasmanian, Northern Territory, Victorian,
     Canberra, Sydney, Melbourne, Brisbane, Adelaide, Hobart, Perth, Gold Coast]

  # Australian organisations and the sectors (worker/ai/tasks.py SECTORS) they are in.
