# Source discovery (worker/discovery/): the worker's nightly Tavily searches, and SERAPH's gate a
# found feed must pass, probe after probe, before it is collected.

search:
  # Tavily's free tier is 1,000 credits a month. A basic search costs one, and the client pins
  # it there (search_depth basic, auto_parameters off). Thirty a day stays under the month.
  credits_per_day: 30
  results_per_query: 10
  time_range: week
  # The searches. Each night runs them in order until the day's credits are spent.
  queries:
    - Australian cyber security incident
    - Australian data breach notification OAIC
    - Australian critical infrastructure cyber attack
    - Australian Signals Directorate cyber advisory
    - Australian health sector cyber attack
    - Australian university cyber security research
    - Australian AI policy regulation
    - Australian government AI safety
    - AI red teaming research
    - MCP server security vulnerability
    - prompt injection attack research
    - LLM jailbreak vulnerability disclosure
    - AI model supply chain attack
    - ransomware group new victims
    - vendor PSIRT security advisory
    - zero-day exploited in the wild
  # Hosts never proposed: platforms where one account is not a source, and search engines.
  skip_hosts:
    - x.com
    - twitter.com
    - facebook.com
    - instagram.com
    - linkedin.com
    - reddit.com
    - youtube.com
    - tiktok.com
    - medium.com
    - substack.com
    - github.com
    - google.com
    - news.google.com
    - bing.com
    - wikipedia.org
    - en.wikipedia.org
    - msn.com
    - yahoo.com

gate:
  # One probe per candidate per gate pass (every 4 hours), so six in a row is a day of feeds.
  probes_to_activate: 6
  # Failed probes in a row before a candidate is rejected for good.
  failures_to_reject: 3
  # A healthy probe finds at least this many items dated in the last `recent_days` ...
  recent_days: 14
  min_recent_items: 3
  # ... this many of them on the beat (`beat` below, or a CVE), and at least this share of them:
  # a whole-site news feed (The Guardian's, 2026-10) carries two security stories a day among a
  # hundred others. The publisher holds back the off-beat items of an active discovered source
  # below the same share (worker/publish/hold.py) ...
  min_on_beat: 2
  min_on_beat_share: 0.5
  # ... and no more than this share of them already collected from another source.
  max_already_collected: 0.6
  # The most candidates one pass probes, and the most homes it searches for a feed. A candidate
  # not yet ready comes first, one never probed before any other, so a new find gets its first
  # probe at the next pass.
  probes_per_pass: 10
  homes_per_pass: 5
  # Candidates being tested at once. While it is full, TACHIKOMA's proposals of a feed are
  # queued (the ops API answers 202), and each pass moves the oldest into the slots that free.
  # A home page is not counted: it has no feed to test yet.
  max_open: 20
  # Discovered sources collected at once. A candidate ready while it is full waits, and is
  # probed again every `ready_reprobe_hours` rather than every pass, so it does not take the
  # probes of candidates still being tested. A failed probe sends it back to the start.
  max_active: 25
  ready_reprobe_hours: 24
  # Room for a ready candidate while `max_active` is full: each pass retires up to `per_pass`
  # discovered sources (never a curated one, and never more than there are candidates waiting),
  # lowest reputation first, among those collected for at least `min_days` that another source
  # corroborated less than `corroboration_below` of the time. That is source-health.json's
  # `reputation.corroboration`, over 90 days; a source with too few events to judge is kept.
  # Retired is final, as for a source gone silent. `per_pass: 0` turns this off.
  prune:
    per_pass: 2
    min_days: 21
    corroboration_below: 0.05
  # A host found by a search but never given a feed is forgotten after this long.
  forget_after_days: 90
  # Words that put an item on CyberPulse's beat, matched at the start of a word in its title or
  # summary.
  beat:
    - cyber
    - security
    - vulnerab
    - exploit
    - ransomware
    - malware
    - breach
    - phishing
    - hack
    - threat
    - patch
    - zero-day
    - 0-day
    - backdoor
    - botnet
    - espionage
    - data leak
    - privacy
    - incident
    - advisory
    - attack
    - prompt injection
    - jailbreak
    - AI safety
    - LLM
    # Added 2026-10-30, from security stories the list above missed (CYB-62).
    - bug
    - leak
    - fraud
    - scam
    - spyware
    - stealer
    - infostealer
    - trojan
    - rootkit
    - deepfake
    - encrypt
    - credential
    - password
    - passkey
    - authenticat
    - privilege
    - surveillance
    - extortion
    - firewall
    - intrusion
    - ddos
    - artificial intelligence
    - machine learning
    - language model
    - chatbot
    - agentic
    - generative
    - OpenAI
    - Anthropic
    - ChatGPT
  # Matched as whole words in this case only: as the start of a word they would match "aid",
  # "rate", "social".
  beat_words:
    - AI
    - AGI
    - GPT
    - RAT
    - APT
    - IAM
    - MFA
    - SSO
    - VPN
    - EDR
    - XDR
    - SIEM
    - SOC
    - SBOM
    - SCADA
    - CISA
    - ACSC
    - NCSC
    - CERT
